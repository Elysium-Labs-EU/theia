version: '3'

# GOLANGCI_LINT_VERSION comes from the parent Taskfile.yml via this include's
# `vars:` passthrough -- do not redeclare it here (see taskfiles/setup.yml for
# why: a self-referencing redeclaration shadows the passed-in value with empty).

tasks:
  lint:
    desc: Run all linters (always the pinned golangci-lint version, regardless of what's on PATH)
    deps: [check-pubkey-sync]
    cmds:
      - echo "Running linters..."
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run --timeout=5m

  check-pubkey-sync:
    desc: Fail if the release signing public key in cmd/update.go and install.sh have drifted apart
    cmds:
      - sh scripts/check-pubkey-sync.sh

  check-file-size:
    desc: Fail if a changed file vs origin/main is oversized or an LFS pointer
    cmds:
      - bash scripts/check-file-size.sh

  check-arrow-notation:
    desc: Fail if markdown prose uses arrow notation (ASCII ->/<- or HTML entities)
    cmds:
      - bash scripts/check-arrow-notation.sh

  check-golangci-pin:
    desc: Fail if the golangci-lint version has drifted from .golangci-lint-version anywhere
    cmds:
      - bash scripts/check-golangci-pin.sh

  check-action-pins:
    desc: Fail if a GitHub Actions workflow references an action by floating tag instead of SHA
    cmds:
      - bash scripts/check-action-pins.sh

  nilcheck:
    desc: 'Static nil-pointer safety analysis (requires: go install go.uber.org/nilaway/cmd/nilaway@latest)'
    cmds:
      - echo "Running nilaway nil pointer analysis..."
      - 'command -v nilaway >/dev/null 2>&1 || { echo "nilaway not found. Run: task setup:setup"; exit 1; }'
      - nilaway ./...

  crap:
    desc: 'Change-scoped CRAP gate (fails only on functions this change modified; requires: go install github.com/padiazg/go-crap@latest)'
    deps: [":test:coverage-check"]
    cmds:
      - echo "Running change-scoped go-crap CRAP gate..."
      - 'command -v go-crap >/dev/null 2>&1 || { echo "go-crap not found. Run: task setup:setup"; exit 1; }'
      - bash scripts/go-crap-gate.sh .

  crap-report:
    desc: 'Full whole-repo CRAP report (informational, non-blocking)'
    cmds:
      - echo "Running whole-repo go-crap CRAP report..."
      - 'command -v go-crap >/dev/null 2>&1 || { echo "go-crap not found. Run: task setup:setup"; exit 1; }'
      - go-crap scan

  govulncheck:
    desc: 'Reachability-aware vulnerability scan (complements OSV-Scanner''s lockfile-only scan)'
    cmds:
      - 'command -v govulncheck >/dev/null 2>&1 || { echo "govulncheck not found. Run: task setup:setup"; exit 1; }'
      - govulncheck ./...

  secrets:
    desc: 'Scan full git history + working tree for committed secrets'
    cmds:
      - 'command -v gitleaks >/dev/null 2>&1 || { echo "gitleaks not found. Run: task setup:setup"; exit 1; }'
      - gitleaks detect --source . --no-banner --redact