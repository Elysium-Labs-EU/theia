version: '3'

# LDFLAGS, BINARY_NAME, VERSION come from the parent Taskfile.yml via this include's vars:
# passthrough -- do not redeclare them here (see taskfiles/setup.yml for why).

tasks:
  release-local:
    desc: Build release binaries locally
    cmds:
      - echo "Building release binaries..."
      - mkdir -p dist
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-linux-amd64 .
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build {{.LDFLAGS}} -o dist/{{.BINARY_NAME}}-linux-arm64 .
      - cd dist && sha256sum {{.BINARY_NAME}}-linux-* > sha256sums.txt
      - echo "Release binaries built in ./dist/"
      - ls -lh dist/

  changelog:
    desc: Generate CHANGELOG.md from git history
    cmds:
      - 'command -v git-cliff >/dev/null 2>&1 || { echo "git-cliff not found. Install: https://git-cliff.org/docs/installation"; exit 1; }'
      - git cliff --output CHANGELOG.md
      - echo "CHANGELOG.md updated"

  changelog-preview:
    desc: Preview unreleased changes (does not write to file)
    cmds:
      - 'command -v git-cliff >/dev/null 2>&1 || { echo "git-cliff not found. Install: https://git-cliff.org/docs/installation"; exit 1; }'
      - git cliff --unreleased

  release-prepare:
    desc: Regenerate the changelog for a tag and commit it locally (main is protected -- push this branch and merge it via PR before running 'release')
    vars:
      TAG: '{{.TAG}}'
    cmds:
      - |
        if [ -z "{{.TAG}}" ]; then echo "Usage: task release:release-prepare TAG=v1.2.0"; exit 1; fi
      - 'command -v git-cliff >/dev/null 2>&1 || { echo "git-cliff not found. Install: https://git-cliff.org/docs/installation"; exit 1; }'
      - git cliff --tag {{.TAG}} --output CHANGELOG.md
      - git add CHANGELOG.md
      - 'git diff --cached --quiet CHANGELOG.md || git commit -m "chore: update changelog for {{.TAG}}"'
      - echo "CHANGELOG.md updated for {{.TAG}}. Push this branch, open a PR against main, and merge it before running 'task release:release TAG={{.TAG}}'."

  release:
    desc: Tag and push a release (run on main after the release-prepare changelog PR is merged)
    vars:
      TAG: '{{.TAG}}'
    cmds:
      - |
        if [ -z "{{.TAG}}" ]; then echo "Usage: task release:release TAG=v1.2.0"; exit 1; fi
      - git tag -a {{.TAG}} -m "Release {{.TAG}}"
      - git push origin {{.TAG}}

  pre-release:
    desc: Tag and push a pre-release
    vars:
      TAG: '{{.TAG}}'
    cmds:
      - |
        if [ -z "{{.TAG}}" ]; then echo "Usage: task release:pre-release TAG=v1.2.0-rc.1"; exit 1; fi
      - git tag -a {{.TAG}} -m "Pre-release {{.TAG}}"
      - git push origin {{.TAG}}

  test-install-local:
    desc: Build and test local binary install in VPS simulator
    cmds:
      - task: docker:vps
      - sleep 5
      - echo "Copying binary to VPS..."
      - docker cp dist/{{.BINARY_NAME}}-linux-amd64 vps-test-theia:/usr/local/src/{{.BINARY_NAME}}-local
      - docker exec -it vps-test-theia ls -la /usr/local/src/{{.BINARY_NAME}}-local
      - echo "Running install.sh..."
      - docker exec -it vps-test-theia bash -c "cd /test-scripts && bash install.sh -y --local /usr/local/src/{{.BINARY_NAME}}-local"
      - docker exec -it vps-test-theia bash -c 'curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash && \. "$HOME/.nvm/nvm.sh" && nvm install 24 && corepack enable pnpm'

  test-install-remote:
    desc: Test remote install.sh in VPS simulator
    cmds:
      - task: docker:vps
      - sleep 5
      - echo "Running install.sh..."
      - docker exec -it vps-test-theia bash -c "cd /test-scripts && bash install.sh"